[project]
name = "seoah"
version = "0.1.0"
description = "MoE sub-sub club leader V-Tuber"
readme = "../README.md"
authors = [
    { name = "devngho", email = "yjh135908@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "omnivoice>=0.2.1",
    "pydantic>=2.13.5",
    "supertonic>=1.3.1",
    "soundfile>=0.14.0",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
]

# The standalone worker runs under CosyVoice's Python 3.10, not core's 3.14.
[tool.ruff.per-file-target-version]
"src/seoah/audio/_cosyvoice_worker.py" = "py310"

[project.scripts]
seoah = "seoah:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
